name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: The-Nick-X
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # 1. Coding Habits (घंटे और दिन के हिसाब से कमिट ग्राफ)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 2. 3D Isometric Contributions Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 3. Most Used Languages (बार ग्राफ के साथ)
          plugin_languages: yes
          plugin_languages_details: bytes, percentage
          plugin_languages_limit: 8

          # 4. Mastered Technologies & Topics (आइकॉन्स)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 18

          # 5. Projects (प्रोजेक्ट्स की जानकारी)
          plugin_projects: yes
          plugin_projects_limit: 2
